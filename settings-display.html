<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./public/styles/index.css">
</head>

<body>
    <div class="settings-container" id="main-container">
        <div class="div-settings">
            <div class="div-settings__header">
                <h2 class="div-settings__title"> Игроки </h2>
                <button class="div-settings__button-square" id="add-player-button"> + </button>
            </div>
            <div class="div-settings__inputs" id="players_div">
                <input class="div-settings__input player" value="Игрок 1"></input>
                <input class="div-settings__input player" value="Игрок 2"></input>
                <input class="div-settings__input player" value="Игрок 3"></input>
            </div>
        </div>
        <div class="div-settings">
            <div class="div-settings__header">
                <h2 class="div-settings__title"> Количество шпионов </h2>
            </div>
            <input class="div-settings__input" value="1" id="spy-count-input"></input>
            <p class="div-settings__text"> Впишите rand для случайного количества игроков с ролью шпион </p>
        </div>
        <div class="div-settings">
            <div class="div-settings__header">
                <h2 class="div-settings__title"> Выбор режима </h2>
            </div>
            <select class="div-settings__input" id="theme">
                <option value="dota_heroes_video.json"> Дота герои видео </option>
                <option value="dota_heroes_image.json"> Дота герои фото </option>
                <option value="dota_staff_image.json"> Дота предметы </option>
                <option value="dota_ult_image.json"> Дота ульты </option>
                <option value="dota_ult_image.json"> Дота все способности (для мазохистов) </option>
                <option value="rand"> Случайная тема </option>
            </select>
            <div class="div-settings__inputs">
                <input class="div-settings__input" id="input_player_theme" type="file"
                    onclick="this.value = ''"></input>
                <button onclick="downloadFile()" class="div-settings__button">Скачать пример файла темы</button>
            </div>
        </div>
        <div class="button-div">
            <button class="settings-button" id="start-game-button"> Запустить игру </button>
            <div class="button-div__checkbox-div">
                <input type="checkbox" id="save-settings" class="button-div__checkbox">
                <label for="save-settings" button-div__label> Сохранить параметры игры </label>
            </div>
        </div>

    </div>
</body>

</html>

<script src="./js/ErrorManager.js"> </script>
<script src="./js/JsonManager.js"> </script>
<script src="./js/Game.js"> </script>
<script src="./js/GameManager.js"> </script>
<script src="./js/Themes.js"> </script>

<script>

</script>

<script>
    const main_div = document.querySelector('#main-container');
    gameManager = new GameManager(main_div);
</script>

<script>
    function downloadFile() {
        fetch('./datapacks/example.json')
            .then(response => response.blob())
            .then(blob => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Пример темы.json';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            })
            .catch(error => {
                alert('Ошибка скачивания файла');
                console.error(error);
            });
    }
</script>
