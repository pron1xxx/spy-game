<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./public/styles/index.css">
</head>

<body>
    <div class="settings-container">
        <div class="div-settings">
            <div class="div-settings__header">
                <h2 class="div-settings__title"> Игроки </h2>
                <button class="div-settings__button-square"> + </button>
            </div>
            <div class="div-settings__inputs">
                <input class="div-settings__input" value="Игрок 1"></input>
                <input class="div-settings__input" value="Игрок 2"></input>
                <input class="div-settings__input" value="Игрок 3"></input>
            </div>
        </div>
        <div class="div-settings">
            <div class="div-settings__header">
                <h2 class="div-settings__title"> Количество шпионов</h2>
            </div>
            <input class="div-settings__input" value="1"></input>
            <p class="div-settings__text"> Впишите rand для случайного количества игроков с ролью шпион </p>
        </div>
        <button class="settings-button"> Запустить игру </button>
    </div>
</body>
</html>
