<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./public/styles/index.css">
</head>

<body>
    <div class="settings-container" id="main-container">
        <div class="div-settings">
            <div class="div-settings__header">
                <h2 class="div-settings__title"> Игроки </h2>
                <button class="div-settings__button-square" id="add-player-button"> + </button>
            </div>
            <div class="div-settings__inputs">
                <input class="div-settings__input player" value="Игрок 1"></input>
                <input class="div-settings__input player" value="Игрок 2"></input>
                <input class="div-settings__input player" value="Игрок 3"></input>
            </div>
        </div>
        <div class="div-settings">
            <div class="div-settings__header">
                <h2 class="div-settings__title"> Количество шпионов </h2>
            </div>
            <input class="div-settings__input" value="1" id="spy-count-input"></input>
            <p class="div-settings__text"> Впишите rand для случайного количества игроков с ролью шпион </p>
        </div>
        <button class="settings-button" id="start-game-button"> Запустить игру </button>
    </div>
</body>

</html>

<script src="./js/Game.js"> </script>

<script>
    const inputs_div = document.querySelector(".div-settings__inputs")
    document.querySelector("#add-player-button").addEventListener('click', () => {
        inputs_div.insertAdjacentHTML("beforeend", 
            `
            <input class="div-settings__input player" value="Игрок"></input>
            `
        )
    })
</script>

<script>
    start_button = document.querySelector("#start-game-button");
    start_button.addEventListener('click', () => {
        const main_div = document.querySelector('#main-container');
        const spy_count = document.querySelector('#spy-count-input').value;
        const players_divs = document.querySelectorAll(".player")
        const players = [];

        players_divs.forEach((player_div) => {
            players.push(player_div.value)
        })

        const game = new Game(players, spy_count, main_div);
        game.start_game();
    })
</script>
